<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Browse Movies — KIDEONI MOVIES</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="logo">KIDE<span class="accent">ONI</span></div>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="browse.html" class="active">Movies</a>
      <a href="reels.html">Reels</a>
      <a href="pricing.html">Plans</a>
    </div>
    <div class="nav-right">
      <div id="navAuthSlot" style="display:flex; gap:10px; align-items:center;"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<main class="wrap section">
  <h1 style="font-size:40px; margin-bottom:20px;">Movies</h1>

  <div class="panel" style="display:flex; gap:16px; flex-wrap:wrap; align-items:end; margin-bottom:28px;">
    <div class="field" style="flex:2; min-width:220px; margin-bottom:0;">
      <label for="searchInput">Search</label>
      <input id="searchInput" type="text" placeholder="Search by title…" />
    </div>
    <div class="field" style="flex:1; min-width:160px; margin-bottom:0;">
      <label for="genreFilter">Genre</label>
      <select id="genreFilter">
        <option value="">All genres</option>
        <option value="Drama">Drama</option>
        <option value="Comedy">Comedy</option>
        <option value="Action">Action</option>
        <option value="Romance">Romance</option>
        <option value="Thriller">Thriller</option>
        <option value="Documentary">Documentary</option>
      </select>
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--paper-dim); padding-bottom:12px;">
      <input type="checkbox" id="freeOnlyToggle" /> Free only
    </label>
  </div>

  <div class="grid" id="browseGrid">
    <div class="poster-card skeleton"></div>
    <div class="poster-card skeleton"></div>
    <div class="poster-card skeleton"></div>
    <div class="poster-card skeleton"></div>
    <div class="poster-card skeleton"></div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="logo" style="font-size:20px;">KIDE<span class="accent">ONI</span> MOVIES</div>
    <div>© <span id="year"></span> KIDEONI MOVIES. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/nav.js"></script>
<script src="js/movies.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
loadBrowse();
</script>
</body>
</html>
