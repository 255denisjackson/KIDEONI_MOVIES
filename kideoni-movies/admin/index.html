<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — KIDEONI MOVIES</title>
<link rel="stylesheet" href="../css/styles.css" />
<style>
  .studio-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; flex-wrap:wrap; gap:14px; }
  .studio-head h1 { font-size:26px; margin:0; }
  .tabs { display:flex; gap:8px; margin-bottom:22px; }
  .tab-btn {
    background:var(--ink-card); border:1px solid var(--ink-line); color:var(--paper-dim);
    padding:9px 18px; border-radius:20px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .tab-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .toolbar { display:flex; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input { max-width:280px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; color:var(--paper-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:0 10px 10px; border-bottom:1px solid var(--ink-line); }
  td { padding:12px 10px; border-bottom:1px solid var(--ink-line); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  .thumb { width:42px; height:60px; object-fit:cover; border-radius:5px; background:var(--ink-card-2); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="logo">KIDE<span class="accent">ONI</span> <span class="muted" style="font-size:13px;">Studio</span></a>
    <div class="nav-right">
      <a href="../index.html" class="btn btn-ghost btn-sm">Back to site</a>
    </div>
  </div>
</nav>

<main class="wrap section">
  <div class="studio-head">
    <h1>Content studio</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="movies">Movies</button>
    <button class="tab-btn" data-tab="reels">Reels</button>
  </div>

  <!-- Movies tab -->
  <div id="moviesTab">
    <div class="toolbar">
      <input id="movieSearch" type="text" placeholder="Search movies…" />
      <button class="btn btn-primary" id="newMovieBtn">+ Add movie</button>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th></th><th>Title</th><th>Status</th><th>Free</th><th>Views</th><th></th></tr></thead>
        <tbody id="moviesBody"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Reels tab -->
  <div id="reelsTab" style="display:none;">
    <div class="toolbar">
      <input id="reelSearch" type="text" placeholder="Search reels…" />
      <button class="btn btn-primary" id="newReelBtn">+ Add reel</button>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th></th><th>Title</th><th>Status</th><th>Views</th><th></th></tr></thead>
        <tbody id="reelsBody"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Movie modal -->
<div class="modal-backdrop" id="movieModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <h3 id="movieModalTitle" style="margin:0;">Add movie</h3>
      <button class="btn btn-ghost btn-sm" type="button" id="cancelMovieBtn">Close</button>
    </div>
    <form id="movieForm">
      <input type="hidden" name="id" />
      <div class="field"><label>Title *</label><input name="title" required /></div>
      <div class="field"><label>Slug</label><input name="slug" placeholder="auto-generated-if-blank" /></div>
      <div class="field"><label>Synopsis</label><textarea name="synopsis"></textarea></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 14px;">
        <div class="field"><label>Release year</label><input name="release_year" type="number" /></div>
        <div class="field"><label>Duration (seconds)</label><input name="duration_seconds" type="number" /></div>
      </div>
      <div class="field"><label>Genres (comma separated)</label><input name="genres" placeholder="Drama, Thriller" /></div>
      <div class="field"><label>Poster URL</label><input name="poster_url" /></div>
      <div class="field"><label>Backdrop URL</label><input name="backdrop_url" /></div>
      <div class="field"><label>Video file</label><input name="videoFile" type="file" accept="video/*" />
        <p class="muted" id="currentPathLabel" style="margin-top:6px;"></p>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:12px;"><input type="checkbox" name="is_free" style="width:auto;" /> Free to watch</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:12px;"><input type="checkbox" name="is_featured" style="width:auto;" /> Feature on homepage</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:18px;"><input type="checkbox" name="is_published" style="width:auto;" checked /> Published</label>
      <button class="btn btn-primary btn-block" type="submit">Save movie</button>
      <p class="form-msg" id="movieMsg"></p>
    </form>
  </div>
</div>

<!-- Reel modal -->
<div class="modal-backdrop" id="reelModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <h3 id="reelModalTitle" style="margin:0;">Add reel</h3>
      <button class="btn btn-ghost btn-sm" type="button" id="cancelReelBtn">Close</button>
    </div>
    <form id="reelForm">
      <input type="hidden" name="id" />
      <div class="field"><label>Title *</label><input name="title" required /></div>
      <div class="field"><label>Caption</label><textarea name="caption"></textarea></div>
      <div class="field"><label>Thumbnail URL</label><input name="thumbnail_url" /></div>
      <div class="field"><label>Video file</label><input name="videoFile" type="file" accept="video/*" />
        <p class="muted" id="currentReelPathLabel" style="margin-top:6px;"></p>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:18px;"><input type="checkbox" name="is_published" style="width:auto;" checked /> Published</label>
      <button class="btn btn-primary btn-block" type="submit">Save reel</button>
      <p class="form-msg" id="reelMsg"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-content.js"></script>
</body>
</html>
