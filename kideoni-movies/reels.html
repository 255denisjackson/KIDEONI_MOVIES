<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reels — KIDEONI MOVIES</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .reels-feed {
    height: calc(100vh - 74px);
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  .reels-feed::-webkit-scrollbar { display: none; }
  .reel-slide {
    height: calc(100vh - 74px);
    scroll-snap-align: start;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .reel-slide video {
    height: 100%; max-height: calc(100vh - 74px);
    aspect-ratio: 9/16;
    object-fit: cover;
    background: #000;
    border-radius: 0;
  }
  @media (min-width: 640px) { .reel-slide video { border-radius: var(--radius-l); } }
  .reel-info {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 30px; width: min(360px, 92vw);
    background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
    padding: 40px 16px 14px; border-radius: 0 0 var(--radius-l) var(--radius-l);
    pointer-events: none;
  }
  .reel-info strong { display:block; font-size: 16px; }
  .reel-info span { font-size: 13px; color: var(--paper-dim); }
  .reel-tap-hint {
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transition: opacity .15s ease;
  }
  .reel-tap-hint.show { opacity: 1; }
  .reel-tap-hint .icon-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size: 28px;
  }
  .reel-mute-btn {
    position:absolute; right: 14px; bottom: 100px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.45); color:#fff;
    border:none; font-size:17px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index: 3;
  }
  .reel-spinner {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }

  .reel-actions {
    position:absolute; right:10px; bottom:150px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    z-index:3;
  }
  .reel-action-btn {
    background:none; border:none; color:#fff; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; padding:0;
  }
  .reel-action-btn .icon-disc {
    width:44px; height:44px; border-radius:50%;
    background: rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:21px; transition: transform .12s ease;
  }
  .reel-action-btn.liked .icon-disc { color:#f25a24; }
  .reel-action-btn.saved .icon-disc { color:#F25A24; }
  .reel-action-btn:active .icon-disc { transform: scale(0.88); }

  .comments-sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background: var(--ink-card, #16171b);
    border-radius: 16px 16px 0 0;
    max-height:70vh; display:flex; flex-direction:column;
    transform: translateY(100%); transition: transform .22s ease;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.4);
  }
  .comments-sheet.open { transform: translateY(0); }
  .comments-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--ink-line, #262a34);
    font-weight:600;
  }
  .comments-head button { background:none; border:none; color:inherit; font-size:20px; cursor:pointer; }
  .comments-list { overflow-y:auto; padding:12px 18px; flex:1; display:flex; flex-direction:column; gap:14px; }
  .comment-row strong { display:block; font-size:13px; }
  .comment-row span { font-size:13.5px; }
  .comment-row .muted { font-size:11px; }
  .comments-compose {
    display:flex; gap:10px; padding:12px 18px; border-top:1px solid var(--ink-line, #262a34);
  }
  .comments-compose input {
    flex:1; background:var(--ink-bg, #0a0a0b); border:1px solid var(--ink-line, #262a34);
    color:#fff; border-radius:20px; padding:9px 14px; font-size:13.5px; outline:none;
  }
  .comments-compose button {
    background:#f25a24; color:#fff; border:none; border-radius:20px; padding:0 18px; font-weight:600; cursor:pointer;
  }
  .sheet-backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:39;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-backdrop.show { opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">KIDE<span class="accent">ONI</span></a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="browse.html">Movies</a>
      <a href="reels.html" class="active">Reels</a>
      <a href="pricing.html">Plans</a>
    </div>
    <div class="nav-right">
      <div id="navAuthSlot" style="display:flex; gap:10px; align-items:center;"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<div class="reels-feed" id="reelsFeed">
  <div class="center" style="padding-top:120px;"><div class="spinner" style="margin:0 auto;"></div></div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="comments-sheet" id="commentsSheet">
  <div class="comments-head">
    <span>Comments</span>
    <button id="closeCommentsBtn" aria-label="Close">✕</button>
  </div>
  <div class="comments-list" id="commentsList"></div>
  <div class="comments-compose">
    <input id="commentInput" type="text" maxlength="1000" placeholder="Add a comment…" />
    <button id="sendCommentBtn">Post</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script src="js/reels.js"></script>
</body>
</html>
