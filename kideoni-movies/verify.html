<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify your email — KIDEONI MOVIES</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  :root { --accent:#F25A24; }
  body { background:#0a0a0b; }
  .verify-shell {
    min-height: calc(100vh - 74px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .verify-card {
    width:100%; max-width: 420px;
    background: #151517;
    border: 1px solid #232326;
    border-radius: 18px;
    padding: 40px 32px 34px;
    text-align:center;
  }
  .mail-orbit {
    position:relative; width:88px; height:88px; margin:0 auto 22px;
  }
  .mail-ring {
    position:absolute; inset:0; border-radius:50%;
    border: 2px solid rgba(242,90,36,0.35);
    animation: pulse-ring 2.2s ease-out infinite;
  }
  .mail-ring.delay { animation-delay: 1.1s; }
  @keyframes pulse-ring {
    0% { transform: scale(0.7); opacity: 0.9; }
    80% { opacity: 0; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .mail-icon {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    width:88px; height:88px; border-radius:50%;
    background: linear-gradient(145deg, var(--accent), #c2451a);
    font-size: 34px; color:#fff;
    animation: float 3s ease-in-out infinite;
    transition: background .3s ease, transform .3s ease;
  }
  .mail-icon.success { background: linear-gradient(145deg, #34c775, #1f9d57); animation: pop 0.5s ease; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .verify-title { font-size: 22px; font-weight:700; margin: 4px 0 8px; }
  .verify-sub { color:#9a9aa2; font-size: 13.5px; margin: 0 0 26px; line-height:1.5; }
  .verify-sub strong { color:#fff; font-weight:600; }

  .otp-field {
    display:flex; justify-content:center; margin-bottom: 18px;
  }
  #otpInput {
    width: 100%; max-width: 240px;
    background: #0a0a0b; border: 1.5px solid #2a2a2e;
    border-radius: 12px; color:#fff;
    font-size: 26px; letter-spacing: 10px; text-align:center;
    font-family: 'SF Mono', 'Courier New', monospace;
    padding: 14px 10px 14px 20px;
    outline:none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  #otpInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(242,90,36,0.15); }

  #verifyStatus { font-size: 13px; color: #9a9aa2; min-height: 18px; margin-bottom: 18px; }
  #verifyStatus.success { color: #34c775; font-weight:600; }

  .verify-btn {
    width:100%; padding: 13px; border-radius: 10px; border:none;
    background: var(--accent); color:#fff; font-weight:700; font-size:14.5px;
    cursor:pointer; transition: filter .15s ease; margin-bottom: 14px;
  }
  .verify-btn:hover { filter: brightness(1.08); }
  .verify-btn:disabled { opacity:.55; cursor:default; }

  .resend-row { font-size: 13px; color:#77777d; }
  .resend-row button {
    background:none; border:none; color: var(--accent); font-weight:600;
    cursor:pointer; font-size:13px; padding:0;
  }
  .resend-row button:disabled { color:#555; cursor:default; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">KIDE<span class="accent">ONI</span></a>
  </div>
</nav>

<div class="verify-shell">
  <div class="verify-card">
    <div class="mail-orbit">
      <div class="mail-ring"></div>
      <div class="mail-ring delay"></div>
      <div class="mail-icon" id="verifyMailIcon">✉️</div>
    </div>

    <h1 class="verify-title">Check your inbox</h1>
    <p class="verify-sub">We sent a 6-digit code to <strong id="verifyEmailLabel">your email</strong>. Enter it below to verify your account.</p>

    <div class="otp-field">
      <input id="otpInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······" autocomplete="one-time-code" />
    </div>

    <p id="verifyStatus"></p>

    <button class="verify-btn" id="verifyBtn" type="button">Verify email</button>

    <p class="resend-row">
      Didn't get it? <button id="resendBtn" type="button">Resend code</button>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
  // Only allow digits, and auto-focus for convenience
  const otpEl = document.getElementById("otpInput");
  otpEl.addEventListener("input", () => {
    otpEl.value = otpEl.value.replace(/\D/g, "").slice(0, 6);
  });
  otpEl.focus();

  initVerifyScreen();
</script>
</body>
</html>
