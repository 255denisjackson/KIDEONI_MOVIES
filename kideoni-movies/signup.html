<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your account — KIDEONI MOVIES</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .auth-shell { min-height: calc(100vh - 65px); display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card { width:100%; max-width:400px; }
  .auth-card h1 { font-size:24px; margin:0 0 6px; }
  .auth-switch { text-align:center; margin-top:18px; font-size:13.5px; color:var(--paper-dim); }
  .auth-switch a { color: var(--accent); font-weight:600; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">KIDE<span class="accent">ONI</span></a>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card panel">
    <h1>Join KIDEONI</h1>
    <p class="muted" style="margin-bottom:24px;">Free reels, plus full movies on any plan.</p>

    <form id="signupForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <p class="muted" style="margin-top:6px;">At least 8 characters.</p>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
      <p class="form-msg" id="formMsg"></p>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("signupForm").addEventListener("submit", handleSignup);
</script>
</body>
</html>
